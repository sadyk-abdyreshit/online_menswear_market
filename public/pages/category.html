<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Category — FORME</title>
<link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-row">
    <a href="../index.html" class="logo">FORME</a>

    <nav class="main-nav">
      <a href="category.html?type=outerwear">Outerwear</a>
      <a href="category.html?type=tailoring">Tailoring</a>
      <a href="category.html?type=knitwear">Knitwear</a>
      <a href="category.html?type=footwear">Footwear</a>
      <a href="category.html?type=accessories">Accessories</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn profile-btn" id="profileBtn" aria-label="Profile">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><circle cx="9.5" cy="6" r="3.3" stroke="currentColor"/><path d="M3 17c1.2-3.6 4-5.4 6.5-5.4S15.3 13.4 16 17" stroke="currentColor" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn basket-btn" id="basketBtn" aria-label="Basket">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M4 6.5h11l-1 9.5a1.3 1.3 0 0 1-1.3 1.2H6.3A1.3 1.3 0 0 1 5 16L4 6.5Z" stroke="currentColor"/><path d="M6.8 6.2V5a2.7 2.7 0 0 1 5.4 0v1.2" stroke="currentColor"/></svg>
        <span class="basket-count" id="basketCount">0</span>
      </button>
    </div>
  </div>
</header>

<!-- CATEGORY HERO / HEADER -->
<main class="products" style="padding-top: 60px;">
  <div class="products-head">
    <h1 class="section-title" id="categoryHeading" style="text-transform: capitalize;">Category</h1>
    <a href="../index.html" class="btn btn-ghost" style="font-size: 12px; padding: 8px 16px;">← Back to Store</a>
  </div>

  <!-- PRODUCT GRID -->
  <div class="product-grid" id="categoryProductGrid">
    <!-- Products will be loaded dynamically here -->
  </div>
</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="footer-bottom">
    <p>&copy; 2026 FORME. All rights reserved.</p>
  </div>
</footer>

<!-- BASKET DRAWER -->
<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="basket-drawer" id="basketDrawer">
  <div class="drawer-head">
    <h3>Your Basket</h3>
    <button class="icon-btn" id="closeBasket" aria-label="Close basket">✕</button>
  </div>
  <div class="drawer-items" id="drawerItems">
    <p class="drawer-empty" id="drawerEmpty">Your basket is empty.</p>
  </div>
  <div class="drawer-foot">
    <div class="drawer-total">
      <span>Subtotal</span>
      <span id="drawerTotal">$0</span>
    </div>
    <a href="../checkout.html" class="btn btn-primary btn-full">Checkout</a>
  </div>
</aside>

<!-- PROFILE DRAWER -->
<aside class="profile-drawer" id="profileDrawer">

    <div class="drawer-head">
        <h3>Account</h3>

        <button
            class="icon-btn"
            id="profileClose"
            aria-label="Close account panel"
        >
            ✕
        </button>
    </div>

    <div class="profile-body" id="profileBody">
        <p>Checking account...</p>
    </div>

</aside>

<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/category.js"></script>

<script>
    initializeProfileUI();
</script>

</body>
</html>

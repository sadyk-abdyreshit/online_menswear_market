<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — FORME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .auth-card {
            max-width: 420px;
            margin: 80px auto;
            padding: 36px;
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--bg);
            font-size: 14px;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-row">
        <a href="/" class="logo">FORME</a>
    </div>
</header>

<main>
    <div class="auth-card">
        <h2 style="margin-bottom: 6px;">Welcome Back</h2>
        <p style="font-size: 14px; color: var(--ink-soft); margin-bottom: 24px;">Sign in to access your orders and account settings.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--ink-soft);">
            Don't have an account? <a href="/register" style="color: var(--ink); font-weight: 500;">Create one</a>
        </p>
    </div>
</main>

<script>
  const loginForm = document.querySelector('form'); 

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault(); 

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok) {
        window.location.href = '/index.html';
      } else {
        alert(`Error: ${data.message}`);
    }
    } catch (error) {
      console.error('Login failed:', error);
    }
  });
</script>

</body>
</html>

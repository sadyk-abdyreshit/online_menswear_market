<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — FORME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .auth-card {
            max-width: 440px;
            margin: 70px auto;
            padding: 36px;
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--bg);
            font-size: 14px;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-row">
        <a href="/" class="logo">FORME</a>
    </div>
</header>

<main>
    <div class="auth-card">
        <h2 style="margin-bottom: 6px;">Create an Account</h2>
        <p style="font-size: 14px; color: var(--ink-soft); margin-bottom: 24px;">Join FORME for exclusive updates and express checkout.</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>

        <p style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--ink-soft);">
            Already have an account? <a href="/login" style="color: var(--ink); font-weight: 500;">Sign in</a>
        </p>
    </div>
</main>

<script>
  const registerForm = document.getElementById('registerForm');

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault(); // Prevents the page refresh

    // Fixed: matches id="fullName" from the input field above
    const name = document.getElementById('fullName').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      const data = await response.json();

      if (response.ok) {
        // Save the JWT to local storage to keep the user logged in
        localStorage.setItem('forme_token', data.token);
        alert('Account created! Redirecting...');
        window.location.href = '/index.html'; // Redirect to homepage
      } else {
        alert(`Error: ${data.message}`);
      }
    } catch (error) {
      console.error('Registration failed:', error);
      alert('Network or server error. Please try again.');
    }
  });
</script>

</body>
</html>

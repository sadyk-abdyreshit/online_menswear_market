<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — FORME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <style>
        .checkout-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        @media (max-width: 850px) {
            .checkout-grid { grid-template-columns: 1fr; }
        }
        .section-box {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 24px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--bg);
            font-size: 14px;
        }
        .cart-summary-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
        }
        .cart-summary-item img {
            width: 50px;
            height: 60px;
            object-fit: cover;
            border-radius: var(--radius);
            background: var(--bg-alt);
        }
        .cart-summary-details { flex: 1; }
        .price-line {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 14px;
        }
        .price-line.total {
            font-weight: 600;
            font-size: 18px;
            border-top: 1px solid var(--line);
            padding-top: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<header class="site-header">
    <div class="header-row">
        <a href="/" class="logo">FORME</a>
        <div><a href="/login" class="btn btn-ghost">Sign In</a></div>
    </div>
</header>

<main class="checkout-grid">
    <!-- SHIPPING & PAYMENT FORM -->
    <div>
        <div class="section-box">
            <h3>1. Shipping Information</h3>
            <form id="checkoutForm">
                <div class="form-row" style="margin-top: 16px;">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" id="firstName" required>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" id="lastName" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Street Address</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" id="city" required>
                    </div>
                    <div class="form-group">
                        <label>Postal Code</label>
                        <input type="text" id="postalCode" required>
                    </div>
                </div>
            </form>
        </div>

        <div class="section-box">
            <h3>2. Payment Method</h3>
            <p style="font-size: 13px; color: var(--ink-soft); margin-top: 8px;">Demo Checkout — standard test order placement.</p>
            <button type="button" class="btn btn-primary btn-full" id="placeOrderBtn" style="margin-top: 20px;">Complete Order</button>
        </div>
    </div>

    <!-- ORDER SUMMARY SIDEBAR -->
    <div>
        <div class="section-box">
            <h3>Order Summary</h3>
            <div id="checkoutItemsList"></div>
            
            <div class="price-line">
                <span>Subtotal</span>
                <span id="subtotalVal">$0</span>
            </div>
            <div class="price-line">
                <span>Shipping</span>
                <span>Free</span>
            </div>
            <div class="price-line total">
                <span>Total</span>
                <span id="totalVal">$0</span>
            </div>
        </div>
    </div>
</main>

<script src="/js/cart.js"></script>
<script>
    function renderCheckout() {
        const items = Cart.getItems();
        const container = document.getElementById('checkoutItemsList');
        const subtotalVal = document.getElementById('subtotalVal');
        const totalVal = document.getElementById('totalVal');

        if (items.length === 0) {
            container.innerHTML = `<p style="padding: 20px 0; color: var(--ink-soft);">Your basket is empty.</p>`;
            subtotalVal.textContent = '$0';
            totalVal.textContent = '$0';
            document.getElementById('placeOrderBtn').disabled = true;
            return;
        }

        let html = '';
        items.forEach(item => {
            let img = item.image ? (item.image.startsWith('/') || item.image.startsWith('http') ? item.image : '/' + item.image) : '';
            html += `
                <div class="cart-summary-item">
                    ${img ? `<img src="${img}" alt="${item.name}">` : '<div class="cart-summary-item"></div>'}
                    <div class="cart-summary-details">
                        <div style="font-weight: 500;">${item.name}</div>
                        <div style="font-size: 12px; color: var(--ink-soft);">Size: ${item.size} | Qty: ${item.quantity}</div>
                    </div>
                    <div>$${item.price * item.quantity}</div>
                </div>
            `;
        });

        container.innerHTML = html;
        const total = Cart.getTotal();
        subtotalVal.textContent = `$${total}`;
        totalVal.textContent = `$${total}`;
    }

    document.getElementById('placeOrderBtn').addEventListener('click', async () => {
        const form = document.getElementById('checkoutForm');
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const orderData = {
            customer: {
                name: `${document.getElementById('firstName').value} ${document.getElementById('lastName').value}`,
                email: document.getElementById('email').value
            },
            shippingAddress: {
                address: document.getElementById('address').value,
                city: document.getElementById('city').value,
                postalCode: document.getElementById('postalCode').value
            },
            items: Cart.getItems(),
            totalAmount: Cart.getTotal()
        };

        try {
            const res = await fetch('/api/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(orderData)
            });
            const data = await res.json();
            if (data.success) {
                Cart.clear();
                alert('Thank you! Your order has been placed successfully.');
                window.location.href = '/';
            }
        } catch (err) {
            alert('Failed to process order.');
        }
    });

    renderCheckout();
</script>
</body>
</html>

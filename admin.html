<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory & Admin Dashboard — FORME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .admin-wrapper {
    max-width: 1200px;
    margin: 40px auto;
    padding: 0 20px;
  }
  .admin-header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
  }
  .stat-card {
    background: var(--white);
    border: 1px solid var(--line);
    padding: 20px;
    border-radius: var(--radius);
  }
  .stat-card h4 {
    font-size: 12px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 8px 0;
  }
  .stat-card .value {
    font-size: 28px;
    font-family: var(--font-display);
    color: var(--ink);
  }

  /* Inventory Table */
  .inventory-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .inventory-table th, .inventory-table td {
    padding: 16px 20px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .inventory-table th {
    background: var(--bg-alt);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
  }
  .inventory-thumb {
    width: 48px;
    height: 60px;
    object-fit: cover;
    background: var(--bg-alt);
    border-radius: var(--radius);
  }
  .tag-badge {
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 12px;
    font-weight: 500;
  }

  /* Modal Popup */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 1000;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-card {
    background: var(--white);
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 30px;
    border-radius: var(--radius);
    position: relative;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--line);
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 6px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    font-family: var(--font-body);
    font-size: 14px;
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <a href="index.html" class="logo">FORME</a>
    <span style="font-size: 13px; color: var(--ink-soft);">Inventory Management</span>
  </div>
</header>

<main class="admin-wrapper">
  <div class="admin-header-bar">
    <div>
      <h2>Inventory Overview</h2>
      <p style="font-size: 14px; color: var(--ink-soft); margin-top: 4px;">Manage stock, view current catalog, and upload new products.</p>
    </div>
    <div style="display: flex; gap: 12px;">
      <button class="btn btn-primary" id="openAddModalBtn">+ Add New Product</button>
      <a href="index.html" class="btn btn-ghost">View Store ↗</a>
    </div>
  </div>

  <!-- STATS OVERVIEW -->
  <div class="stats-grid">
    <div class="stat-card">
      <h4>Total Catalog Products</h4>
      <div class="value" id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <h4>Categories Active</h4>
      <div class="value" id="categoryCount">5</div>
    </div>
    <div class="stat-card">
      <h4>System Status</h4>
      <div class="value" style="font-size: 18px; color: var(--accent);">● Live Sync</div>
    </div>
  </div>

  <!-- INVENTORY TABLE -->
  <table class="inventory-table">
    <thead>
      <tr>
        <th>Image</th>
        <th>Product Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Sizes</th>
        <th style="text-align: right;">Action</th>
      </tr>
    </thead>
    <tbody id="inventoryTableBody">
      <!-- Injected dynamically by admin.js -->
    </tbody>
  </table>
</main>

<!-- ADD PRODUCT MODAL -->
<div class="modal-overlay" id="addModal">
  <div class="modal-card">
    <div class="modal-header">
      <h3>Add New Product</h3>
      <button class="icon-btn" id="closeAddModalBtn" style="font-size: 18px;">✕</button>
    </div>

    <form id="addProductForm" enctype="multipart/form-data">
      <div class="form-group">
        <label for="productName">Product Name</label>
        <input type="text" id="productName" placeholder="e.g., Structured Wool Coat" required>
      </div>

      <div class="form-group">
        <label for="productCategory">Category</label>
        <select id="productCategory" required>
          <option value="outerwear">Outerwear</option>
          <option value="tailoring">Tailoring</option>
          <option value="knitwear">Knitwear</option>
          <option value="footwear">Footwear</option>
          <option value="accessories">Accessories</option>
        </select>
      </div>

      <div class="form-group">
        <label for="productPrice">Price ($)</label>
        <input type="number" id="productPrice" placeholder="250" required min="1">
      </div>

      <div class="form-group">
        <label for="productTag">Tag (Optional)</label>
        <input type="text" id="productTag" placeholder="e.g., New Arrival">
      </div>

      <div class="form-group">
        <label for="productDesc">Description</label>
        <textarea id="productDesc" rows="3" placeholder="Craftsmanship details, cut, fabric composition..."></textarea>
      </div>

      <div class="form-group">
        <label for="productSizes">Available Sizes (comma-separated)</label>
        <input type="text" id="productSizes" placeholder="S, M, L, XL">
      </div>

      <div class="form-group">
        <label for="image1">Primary Image</label>
        <input type="file" id="image1" accept="image/*" required>
      </div>

      <div class="form-group">
        <label for="image2">Hover Image (Optional)</label>
        <input type="file" id="image2" accept="image/*">
      </div>

      <button type="submit" class="btn btn-primary btn-full" style="margin-top: 10px;">Publish Product</button>
      <p id="successMsg" style="text-align:center; font-size:13px; color:var(--accent); margin-top:10px;"></p>
    </form>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
